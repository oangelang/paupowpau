<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PauPowPau</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Luckiest+Guy&display=swap');
        
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: fixed;
        }
        
        body {
            font-family: 'Bangers', 'Comic Sans MS', cursive, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: linear-gradient(135deg, #ffcc99, #ff99cc);
            animation: backgroundChange 15s infinite alternate;
            touch-action: manipulation;
        }
        
        @keyframes backgroundChange {
            0% { background: linear-gradient(135deg, #ffcc99, #ff99cc); }
            20% { background: linear-gradient(135deg, #99ccff, #ff99ff); }
            40% { background: linear-gradient(135deg, #99ff99, #ffff99); }
            60% { background: linear-gradient(135deg, #ff9966, #ff6699); }
            80% { background: linear-gradient(135deg, #cc99ff, #9999ff); }
            100% { background: linear-gradient(135deg, #ff6666, #ffcc66); }
        }
        
        .speech-bubble {
            position: relative;
            background-color: white;
            border: 5px solid black;
            border-radius: 50% 50% 50% 20%;
            padding: 20px;
            text-align: center;
            box-shadow: 8px 8px 0px #333;
            max-width: 90%;
        }
        
        .speech-bubble:before {
            content: "";
            position: absolute;
            bottom: -30px;
            left: 30px;
            width: 40px;
            height: 40px;
            background-color: white;
            border-right: 5px solid black;
            border-bottom: 5px solid black;
            transform: rotate(45deg);
            z-index: -1;
        }
        
        .main-bubble {
            margin-bottom: 50px;
            position: relative;
            transform: rotate(-5deg);
            padding: 20px 40px;
            animation: pulsate 2s infinite alternate;
            z-index: 100;
        }
        
        @keyframes pulsate {
            0% { transform: scale(1) rotate(-5deg); }
            100% { transform: scale(1.05) rotate(-5deg); }
        }
        
        h1 {
            font-family: 'Luckiest Guy', 'Bangers', cursive;
            font-size: 2.5rem;
            letter-spacing: 2px;
            color: #ff3366;
            text-shadow: 3px 3px 0px #ffcc00, 5px 5px 0px #000;
            margin: 0;
            padding: 0;
        }
        
        @media (min-width: 768px) {
            h1 {
                font-size: 3rem;
            }
        }
        
        .image-container {
            position: absolute;
            pointer-events: none;
            z-index: 10;
            will-change: transform;
        }
        
        .image-container img {
            max-width: 300px;
            width: 100%;
            height: auto;
        }
        
        .controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 15px;
        }
        
        .btn {
            background-color: white;
            border: 3px solid #333;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 3px 3px 0px #333;
            font-size: 24px;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        
        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #333;
        }
        
        @media (max-width: 768px) {
            .controls {
                bottom: 30px;
                right: 30px;
            }
            
            .btn {
                width: 70px;
                height: 70px;
                font-size: 30px;
            }
            
            .image-container img {
                max-width: 250px;
            }
        }
        
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f2d74e;
            opacity: 0.8;
            animation: fall linear forwards;
            pointer-events: none;
        }
        
        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        .instruction {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 255, 255, 0.8);
            color: #333;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #333;
            text-align: center;
            z-index: 100;
            max-width: 80%;
            box-shadow: 3px 3px 0px #333;
            font-family: 'Bangers', sans-serif;
            font-size: 20px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="speech-bubble main-bubble">
        <h1>Happy 40th Birthday, Pau!</h1>
    </div>
    
    <div class="controls">
        <div class="btn" id="sound-toggle">🔊</div>
        <div class="btn" id="clear-all">🧹</div>
    </div>
    
    <div class="instruction" id="instruction">👆 Tap anywhere to add Pau effects! 👆</div>
    
    <audio id="background-music" loop>
        <source src="pau.m4a" type="audio/mp4">
        Your browser does not support the audio element.
    </audio>

    <script>
        // Configuration
        const totalImages = 7;
        let soundOn = true;
        
        // Elements
        const music = document.getElementById('background-music');
        const soundToggle = document.getElementById('sound-toggle');
        const clearAllBtn = document.getElementById('clear-all');
        const instruction = document.getElementById('instruction');
        
        // Detect if device is mobile
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        
        // For click events
        document.addEventListener('click', handleInteraction);
        
        // For touch events (mobile)
        document.addEventListener('touchend', function(e) {
            // Don't handle touch on controls
            if (!e.target.closest('.controls') && !e.target.closest('.btn')) {
                handleInteraction(e);
            }
            
            // Prevent zoom behavior on double tap
            e.preventDefault();
        });
        
        // Handle interaction (both click and touch)
        function handleInteraction(e) {
            // Don't create image if clicking on controls
            if (e.target.closest('.controls') || e.target.closest('.btn')) {
                return;
            }
            
            // Play audio
            playAudio();
            
            // Get coordinates
            let x, y;
            
            if (e.type === 'touchend' && e.changedTouches && e.changedTouches.length) {
                x = e.changedTouches[0].clientX;
                y = e.changedTouches[0].clientY;
            } else {
                x = e.clientX;
                y = e.clientY;
            }
            
            // Create image at interaction location
            createImage(x, y);
            
            // Remove instruction on first interaction
            if (instruction && instruction.parentNode) {
                instruction.remove();
            }
        }
        
        // Prevent default on all touch events to avoid browser behaviors
        document.addEventListener('touchstart', function(e) {
            if (!e.target.closest('.controls') && !e.target.closest('.btn')) {
                e.preventDefault();
            }
        }, {passive: false});
        
        // Handle sound toggle (with improved mobile support)
        soundToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            soundOn = !soundOn;
            if (soundOn) {
                music.play();
                soundToggle.textContent = '🔊';
            } else {
                music.pause();
                soundToggle.textContent = '🔇';
            }
        });
        
        // Specifically for mobile
        soundToggle.addEventListener('touchend', function(e) {
            e.stopPropagation();
            e.preventDefault();
            soundOn = !soundOn;
            if (soundOn) {
                music.play();
                soundToggle.textContent = '🔊';
            } else {
                music.pause();
                soundToggle.textContent = '🔇';
            }
        });
        
        // Clear all images (with improved mobile support)
        clearAllBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            clearImages();
        });
        
        // Specifically for mobile
        clearAllBtn.addEventListener('touchend', function(e) {
            e.stopPropagation();
            e.preventDefault();
            clearImages();
        });
        
        function clearImages() {
            document.querySelectorAll('.image-container').forEach(function(el) {
                el.remove();
            });
        }
        
        // Preload images
        const imageCache = [];
        for (let i = 1; i <= totalImages; i++) {
            const img = new Image();
            img.src = `${i}.png`;
            imageCache.push(img);
        }
        
        // Play audio function
        function playAudio() {
            if (soundOn) {
                // Try to play with user interaction
                const playPromise = music.play();
                
                if (playPromise !== undefined) {
                    playPromise.catch(function(error) {
                        console.log("Autoplay prevented:", error);
                    });
                }
            }
        }
        
        // Create and animate an image
        function createImage(x, y) {
            // Choose random image number
            const imageNumber = Math.floor(Math.random() * totalImages) + 1;
            
            // Create container and image
            const container = document.createElement('div');
            container.className = 'image-container';
            
            const img = document.createElement('img');
            img.src = `${imageNumber}.png`;
            img.alt = 'Pau Pow';
            
            // Random size factor (smaller range on mobile)
            const maxSize = isMobile ? 200 : 300;
            const sizeFactor = 0.6 + Math.random() * 0.7; // 0.6 to 1.3 times the size
            const imgSize = maxSize * sizeFactor;
            
            // Add image to container and container to body
            container.appendChild(img);
            document.body.appendChild(container);
            
            // Set initial position for immediate visibility
            container.style.left = `${x - (imgSize/2)}px`;
            container.style.top = `${y - (imgSize/2)}px`;
            img.style.width = `${imgSize}px`;
            
            // Randomly choose animation type
            const animationType = Math.random() < 0.5 ? 'spin' : 'enlarge';
            
            if (animationType === 'spin') {
                // Set initial state for immediate visibility
                container.style.transform = 'rotate(0deg)';
                
                // Spin animation
                let rotation = 0;
                const spinSpeed = 15; // Faster rotation
                const spinInterval = setInterval(function() {
                    rotation += spinSpeed;
                    container.style.transform = `rotate(${rotation}deg)`;
                    
                    if (rotation >= 360) {
                        clearInterval(spinInterval);
                    }
                }, 20); // Faster interval
            } else {
                // Set initial scale for immediate visibility
                container.style.transform = 'scale(0.3)';
                
                // Enlarge animation
                let scale = 0.3; // Start with some visibility
                const growSpeed = 0.08; // Faster growth
                const enlargeInterval = setInterval(function() {
                    scale += growSpeed;
                    container.style.transform = `scale(${scale})`;
                    
                    if (scale >= 1) {
                        clearInterval(enlargeInterval);
                    }
                }, 15); // Faster interval
            }
            
            // Add slight random movement after animation
            setTimeout(function() {
                const moveRange = isMobile ? 80 : 150; // Smaller movement on mobile
                const randomX = (Math.random() - 0.5) * moveRange;
                const randomY = (Math.random() - 0.5) * moveRange;
                container.style.transition = 'transform 2s ease-out, left 15s ease-in-out, top 15s ease-in-out';
                container.style.left = `${parseInt(container.style.left) + randomX}px`;
                container.style.top = `${parseInt(container.style.top) + randomY}px`;
            }, 1000);
        }
        
        // Create confetti
        function createConfetti() {
            // Limit the number of confetti particles based on device
            const confettiCount = document.querySelectorAll('.confetti').length;
            const maxConfetti = isMobile ? 30 : 50;
            
            if (confettiCount > maxConfetti) return;
            
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            
            // Random position, color, size, and animation duration
            const left = Math.random() * 100;
            const width = 5 + Math.random() * 10;
            const height = width * (0.5 + Math.random() * 0.5);
            const duration = 3 + Math.random() * 4;
            
            // Random colors
            const colors = ['#f94144', '#f3722c', '#f8961e', '#f9c74f', '#90be6d', '#43aa8b', '#577590', '#ff99cc', '#9b5de5'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            confetti.style.left = `${left}vw`;
            confetti.style.width = `${width}px`;
            confetti.style.height = `${height}px`;
            confetti.style.backgroundColor = color;
            confetti.style.animationDuration = `${duration}s`;
            
            document.body.appendChild(confetti);
            
            // Remove confetti after animation is complete
            setTimeout(function() {
                if (confetti.parentNode) {
                    confetti.remove();
                }
            }, duration * 1000);
        }
        
        // Create confetti at appropriate interval based on device
        setInterval(createConfetti, isMobile ? 500 : 300);
        
        // Create some initial images with delay
        setTimeout(function() {
            const numInitialImages = isMobile ? 2 : 3;
            for (let i = 0; i < numInitialImages; i++) {
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight;
                createImage(x, y);
            }
        }, 1000);
        
        // Prevent pinch zoom on mobile
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });
        
        // Prevent scrolling on mobile
        document.body.addEventListener('touchmove', function(e) {
            if (!e.target.closest('.controls')) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
